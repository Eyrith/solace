# Reverse proxy example for Matrix Homeserver (matrix.example.com)
# Enforces TLS, authenticated media pass-through, strict CORS to app.example.com ONLY,
# and zero framing. Public www.example.com is never listed in CORS headers.

server {
    listen 443 ssl http2;
    server_name matrix.example.com;

    # TLS certs (e.g. Let's Encrypt / Cloudflare Origin)
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 55M;

    # Deny iframe embedding and MIME sniffing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Restrict CORS strictly to the private Sanctuary origin (app.example.com)
    set $cors_origin "";
    if ($http_origin = "https://app.example.com") {
        set $cors_origin "https://app.example.com";
    }

    location ~ ^/(_matrix|_synapse/client) {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Type, Content-Disposition" always;

        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Block external internet access to /_synapse/admin — only reachable by internal FastAPI backend
    location /_synapse/admin {
        deny all;
        return 403;
    }
}

