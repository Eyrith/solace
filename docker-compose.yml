services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      BACKEND_INTERNAL_URL: http://backend:8000
      ENABLE_BACKGROUND_WORKER: ${ENABLE_BACKGROUND_WORKER:-true}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - sanctuary_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_HOST: ${NEXT_PUBLIC_DEFAULT_HOST:-public}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3080}:3000"
    networks:
      - sanctuary_internal

  gateway:
    image: nginx:1.27-alpine
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/nginx/generated/tunnel-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:${TUNNEL_GATEWAY_PORT:-8088}:8080"
    networks:
      - sanctuary_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - gateway
    network_mode: host
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}


networks:
  sanctuary_internal:
    driver: bridge
